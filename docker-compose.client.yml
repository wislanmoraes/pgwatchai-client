# ─────────────────────────────────────────────────────────────────────────────
#  pgwatch-ai — Template para implantação em parceiros
#
#  Uso:
#    1. Copie este arquivo para o servidor do parceiro
#    2. Crie um .env com as variáveis listadas abaixo
#    3. docker compose -f docker-compose.client.yml up -d
#
#  Pré-requisito: login no registry
#    echo $GHCR_TOKEN | docker login ghcr.io -u SEU_USUARIO --password-stdin
# ─────────────────────────────────────────────────────────────────────────────

name: pgwatchai

x-images: &registry ghcr.io/wislanmoraes

# Hardening comum reaproveitado por todo serviço abaixo (âncora YAML) —
# no-new-privileges bloqueia escalonamento via setuid/setcap mesmo que o
# processo dentro do container tente; log rotation evita que uma instalação
# "sobe e esquece" por meses encha o disco do parceiro com json-file sem limite.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ── Banco de dados (TimescaleDB) ──────────────────────────────────────────
  timescaledb:
    <<: *hardening
    # Pinada (era latest-pg18) — uma troca silenciosa de versão major/minor
    # do TimescaleDB num `docker compose pull` pode quebrar coisas que
    # dependem de versão exata (ex.: compressão nativa, Issue #55/#57).
    # Validado contra esta versão nos ambientes de dev e produção do projeto.
    image: timescale/timescaledb:2.27.2-pg18
    container_name: pgwatch_db
    # Issue #57: pg_stat_statements no banco INTERNO — telemetria do próprio
    # backend, além da que já existe pras instâncias monitoradas. Ver
    # docker-compose.dev.yml pro comentário completo.
    command: [
      "postgres",
      "-c", "shared_preload_libraries=timescaledb,pg_stat_statements",
      "-c", "pg_stat_statements.track=all"
    ]
    environment:
      POSTGRES_USER:     ${DB_USER:-pgwatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatório}
      POSTGRES_DB:       ${DB_NAME:-pgwatch_ai}
    volumes:
      - timescaledb_data:/var/lib/postgresql
    networks:
      - pgwatch_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pgwatch} -d ${DB_NAME:-pgwatch_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 5g
    # TimescaleDB nunca expõe porta para o host — acessível apenas internamente

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwatchai-backend:${IMAGE_TAG:-latest}
    container_name: pgwatch_backend
    user: root   # necessário para acessar /var/run/docker.sock (WatchShell)
    environment:
      DATABASE_URL:      postgresql+asyncpg://${DB_USER:-pgwatch}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-pgwatch_ai}
      DATABASE_URL_SYNC: postgresql://${DB_USER:-pgwatch}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-pgwatch_ai}
      SECRET_KEY:        ${SECRET_KEY:?SECRET_KEY obrigatório}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COLLECTOR_INTERVAL_SECONDS:        ${COLLECTOR_INTERVAL_SECONDS:-60}
      ACTIVITY_SAMPLE_INTERVAL_SECONDS:  ${ACTIVITY_SAMPLE_INTERVAL_SECONDS:-5}
      ALERT_EVALUATION_INTERVAL_SECONDS: ${ALERT_EVALUATION_INTERVAL_SECONDS:-60}
      WATCHSHELL_IMAGE: ghcr.io/wislanmoraes/pgwatchai-watchshell:${IMAGE_TAG:-latest}
      GHCR_USER:  ${GHCR_USER:-wislanmoraes}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
    volumes:
      # Achado numa revisão de segurança: o backend NUNCA lê/escreve nada
      # do diretório de deploy no código real (routers/updates.py) — ele só
      # inspeciona o PRÓPRIO container via socket e delega qualquer apply/
      # rollback pro sidecar `updater` via HTTP (http://updater:8080/...).
      # O antigo `.:/host_deploy:ro` montava o diretório INTEIRO — incluindo
      # o .env com DB_PASSWORD/SECRET_KEY/GHCR_TOKEN em texto puro — sem
      # necessidade nenhuma. Removido; só o socket continua preciso.
      - /var/run/docker.sock:/var/run/docker.sock  # necessário para WatchShell / terminal
    networks:
      - pgwatch_internal
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5g
    # Backend nunca expõe porta para o host — acessível via nginx do frontend

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────
  frontend:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwatchai-frontend:${IMAGE_TAG:-latest}
    container_name: pgwatch_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"   # única porta exposta ao mundo externo
    networks:
      - pgwatch_internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  # ── Updater (sidecar de atualização — sempre ativo) ──────────────────────
  updater:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwatchai-updater:${IMAGE_TAG:-latest}
    container_name: pgwatch_updater
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY obrigatório}
      DEPLOY_DIR: /deploy
      # Caminho REAL no host (não o /deploy interno do container) — o `docker
      # compose` client-side resolve ${PWD} usando o cwd de QUEM RODA este
      # `up` (install.sh/update.sh no host), então isso captura corretamente
      # o diretório de deploy verdadeiro. Necessário pro update.sh conseguir
      # recriar o próprio updater via um container auxiliar (ver update.sh
      # para o comentário completo sobre por que isso importa).
      HOST_DEPLOY_DIR: ${PWD}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      GHCR_USER:  ${GHCR_USER:-wislanmoraes}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Achado numa revisão de segurança: o `.:/deploy:ro` antigo montava o
      # diretório inteiro (incluindo .env com os 3 segredos) só pra
      # update.sh precisar de 3 arquivos específicos. Trocado por bind mounts
      # individuais — reduz o que fica exposto dentro do container ao
      # estritamente necessário:
      #   .env                      → `docker compose` precisa dele no cwd
      #                                pra interpolar ${DB_PASSWORD} etc.
      #                                ao rodar `up`/`pull` dentro do sidecar.
      #   update.sh                 → é o script que o sidecar executa
      #                                (main.py roda `bash update.sh` com
      #                                cwd=/deploy). Fica :ro porque o
      #                                sidecar sempre roda com
      #                                SKIP_SELF_UPDATE=1 — nunca tenta se
      #                                sobrescrever nesse caminho.
      #   docker-compose.client.yml → PRECISA ser gravável (sem :ro): o
      #                                bloco de auto-atualização do compose
      #                                em update.sh roda incondicionalmente
      #                                (não respeita SKIP_SELF_UPDATE) e faz
      #                                `mv` sobre este arquivo sempre que a
      #                                versão no GitHub mudar — com :ro isso
      #                                falhava com "Read-only file system" e
      #                                abortava a atualização inteira antes
      #                                até de chegar no `docker compose pull`
      #                                (bug real, achado nesta revisão).
      - ./.env:/deploy/.env:ro
      - ./update.sh:/deploy/update.sh:ro
      - ./docker-compose.client.yml:/deploy/docker-compose.client.yml
    networks:
      - pgwatch_internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    # Porta 8080 nunca exposta ao host — acessível via /updater/ no Nginx

  # ── WatchShell (ferramenta interativa — opcional) ─────────────────────────
  watchshell:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwatchai-watchshell:${IMAGE_TAG:-latest}
    container_name: pgwatch_watchshell
    profiles:
      - tools   # só sobe com: docker compose --profile tools up -d
    networks:
      - pgwatch_internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

# ── Rede interna ─────────────────────────────────────────────────────────────
networks:
  pgwatch_internal:
    driver: bridge
    internal: false   # false = permite saída para internet (Anthropic API, etc.)
    # Para isolar completamente: mude para internal: true e use um proxy externo

# ── Volumes persistentes ──────────────────────────────────────────────────────
volumes:
  timescaledb_data:
